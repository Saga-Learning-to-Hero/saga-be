# Isolated JPA transaction slice. Do not activate local/dev or the test profile
# that excludes DataSource/JPA.
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.type.preferred_uuid_jdbc_type=CHAR
spring.datasource.url=jdbc:h2:mem:txit;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
saga.auth.bootstrap-admin.enabled=false
saga.integration.github.app-id=123456
saga.mail.enabled=false
management.health.neo4j.enabled=false
management.health.rabbit.enabled=false
