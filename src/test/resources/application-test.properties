# Test profile is isolated from local/cloud DEV services.
# Do not activate application-local.properties here.

saga.auth.bootstrap-admin.enabled=false
saga.auth.google.client-id=
saga.auth.google.client-secret=

spring.autoconfigure.exclude=\
org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,\
org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration,\
org.springframework.boot.data.jpa.autoconfigure.DataJpaRepositoriesAutoConfiguration,\
org.springframework.boot.flyway.autoconfigure.FlywayAutoConfiguration,\
org.springframework.boot.neo4j.autoconfigure.Neo4jAutoConfiguration,\
org.springframework.boot.data.neo4j.autoconfigure.DataNeo4jAutoConfiguration,\
org.springframework.boot.data.neo4j.autoconfigure.DataNeo4jRepositoriesAutoConfiguration,\
org.springframework.boot.amqp.autoconfigure.RabbitAutoConfiguration,\
org.springframework.boot.data.redis.autoconfigure.DataRedisAutoConfiguration,\
org.springframework.boot.data.redis.autoconfigure.DataRedisRepositoriesAutoConfiguration,\
org.springframework.boot.session.autoconfigure.SessionAutoConfiguration,\
org.springframework.boot.session.data.redis.autoconfigure.SessionDataRedisAutoConfiguration,\
org.springframework.boot.mail.autoconfigure.MailSenderAutoConfiguration,\
org.springframework.boot.mail.autoconfigure.MailHealthContributorAutoConfiguration,\
org.springframework.boot.mail.autoconfigure.MailSenderValidatorAutoConfiguration

saga.mail.enabled=false
saga.mail.from=
saga.mail.host=
