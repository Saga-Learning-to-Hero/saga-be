spring.application.name=saga-be

# Railway injects PORT. Local and other environments default to 8080.
server.port=${PORT:8080}

# Optional local dotenv. Missing file must not fail startup on Railway.
spring.config.import=optional:file:.env[.properties]

# Allows SPRING_PROFILES_ACTIVE from the imported .env to activate profiles.
# Real OS/Railway environment variables still take precedence.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:}

management.endpoints.web.exposure.include=health,info

# Auth V1 — server session cookie. Secrets stay in environment.
saga.auth.frontend-origins=${SAGA_AUTH_FRONTEND_ORIGINS:http://localhost:3000}
saga.auth.cookie.same-site=${SAGA_AUTH_COOKIE_SAME_SITE:Lax}
saga.auth.cookie.secure=${SAGA_AUTH_COOKIE_SECURE:false}
saga.auth.google.client-id=${GOOGLE_CLIENT_ID:}
saga.auth.google.client-secret=${GOOGLE_CLIENT_SECRET:}
saga.auth.google.allowed-hosted-domains=${SAGA_AUTH_GOOGLE_ALLOWED_HOSTED_DOMAINS:fpt.edu.vn,fe.edu.vn}
saga.auth.google.success-url=${SAGA_AUTH_GOOGLE_SUCCESS_URL:http://localhost:3000/dashboard}
saga.auth.google.password-setup-url=${SAGA_AUTH_GOOGLE_PASSWORD_SETUP_URL:http://localhost:3000/auth/setup-password}
saga.auth.google.failure-url=${SAGA_AUTH_GOOGLE_FAILURE_URL:http://localhost:3000/login}
saga.auth.bootstrap-admin.enabled=${SAGA_BOOTSTRAP_ADMIN_ENABLED:false}
saga.auth.bootstrap-admin.username=${SAGA_BOOTSTRAP_ADMIN_USERNAME:admin}
saga.auth.bootstrap-admin.password=${SAGA_BOOTSTRAP_ADMIN_PASSWORD:}
saga.auth.bootstrap-admin.email=${SAGA_BOOTSTRAP_ADMIN_EMAIL:admin@saga.local}
saga.auth.bootstrap-lecturer.enabled=${SAGA_BOOTSTRAP_LECTURER_ENABLED:false}
saga.auth.bootstrap-lecturer.username=${SAGA_BOOTSTRAP_LECTURER_USERNAME:}
saga.auth.bootstrap-lecturer.email=${SAGA_BOOTSTRAP_LECTURER_EMAIL:}
saga.auth.bootstrap-lecturer.password=${SAGA_BOOTSTRAP_LECTURER_PASSWORD:}
saga.auth.password.min-length=10
saga.auth.password.max-length=128

server.servlet.session.timeout=${SAGA_SESSION_TIMEOUT:12h}
server.servlet.session.cookie.name=SAGA_SESSION
server.servlet.session.cookie.http-only=true
spring.session.timeout=${SAGA_SESSION_TIMEOUT:12h}
spring.session.redis.namespace=saga:session

# Developer OpenAPI / Swagger UI. CSRF stays enabled; Swagger copies XSRF-TOKEN into X-XSRF-TOKEN.
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.csrf.enabled=true
springdoc.swagger-ui.csrf.cookie-name=XSRF-TOKEN
springdoc.swagger-ui.csrf.header-name=X-XSRF-TOKEN
springdoc.swagger-ui.use-root-path=false
springdoc.packages-to-scan=com.saga.be.controller
springdoc.override-with-generic-response=false
springdoc.show-login-endpoint=false
springdoc.show-oauth2-endpoints=false

# Integration / attribution foundation. Features stay off until secrets are configured.
saga.integration.public-base-url=${SAGA_PUBLIC_BASE_URL:http://localhost:8080}
saga.integration.success-url=${SAGA_INTEGRATION_SUCCESS_URL:http://localhost:3000/integrations/success}
saga.integration.failure-url=${SAGA_INTEGRATION_FAILURE_URL:http://localhost:3000/integrations/failure}
saga.integration.token-encryption-key=${SAGA_INTEGRATION_TOKEN_ENCRYPTION_KEY:}
saga.integration.oauth-state-ttl=${SAGA_OAUTH_STATE_TTL:10m}
saga.integration.installation-token-cache-ttl=${SAGA_GITHUB_INSTALLATION_TOKEN_TTL:50m}
saga.integration.reauth-window=${SAGA_ATTRIBUTION_REAUTH_WINDOW_MINUTES:10}
saga.integration.identity-change-deadline-window=${SAGA_ATTRIBUTION_IDENTITY_CHANGE_DEADLINE_WINDOW_HOURS:24}
saga.integration.jira-webhook-refresh-before-expiry=${SAGA_JIRA_WEBHOOK_REFRESH_BEFORE_EXPIRY:7d}
saga.integration.github.enabled=${SAGA_GITHUB_ENABLED:false}
saga.integration.github.app-id=${SAGA_GITHUB_APP_ID:}
saga.integration.github.app-slug=${SAGA_GITHUB_APP_SLUG:}
saga.integration.github.client-id=${SAGA_GITHUB_CLIENT_ID:}
saga.integration.github.client-secret=${SAGA_GITHUB_CLIENT_SECRET:}
saga.integration.github.private-key-base64=${SAGA_GITHUB_PRIVATE_KEY_BASE64:}
saga.integration.github.webhook-secret=${SAGA_GITHUB_WEBHOOK_SECRET:}
saga.integration.github.oauth-callback-url=${SAGA_GITHUB_OAUTH_CALLBACK_URL:}
saga.integration.github.setup-callback-url=${SAGA_GITHUB_SETUP_CALLBACK_URL:}
saga.integration.jira.enabled=${SAGA_JIRA_ENABLED:false}
saga.integration.jira.client-id=${SAGA_JIRA_CLIENT_ID:}
saga.integration.jira.client-secret=${SAGA_JIRA_CLIENT_SECRET:}
saga.integration.jira.oauth-callback-url=${SAGA_JIRA_OAUTH_CALLBACK_URL:}
saga.integration.jira.team-oauth-callback-url=${SAGA_JIRA_TEAM_OAUTH_CALLBACK_URL:}
saga.integration.jira.webhook-url=${SAGA_JIRA_WEBHOOK_URL:}
saga.integration.webauthn.enabled=${SAGA_WEBAUTHN_ENABLED:false}
saga.integration.webauthn.rp-id=${SAGA_WEBAUTHN_RP_ID:}
saga.integration.webauthn.rp-name=${SAGA_WEBAUTHN_RP_NAME:SAGA}
saga.integration.webauthn.allowed-origins=${SAGA_WEBAUTHN_ALLOWED_ORIGINS:}

# Email delivery foundation. Disabled until SAGA_MAIL_ENABLED=true and SMTP host is set.
saga.mail.enabled=${SAGA_MAIL_ENABLED:false}
saga.mail.from=${SAGA_MAIL_FROM:}
saga.mail.host=${MAIL_HOST:}
saga.mail.max-attempts=${SAGA_MAIL_MAX_ATTEMPTS:5}
saga.mail.batch-size=${SAGA_MAIL_BATCH_SIZE:20}
saga.mail.worker-delay-ms=${SAGA_MAIL_WORKER_DELAY_MS:15000}
saga.mail.claim-stale-after=${SAGA_MAIL_CLAIM_STALE_AFTER:5m}
saga.mail.retry-backoff=${SAGA_MAIL_RETRY_BACKOFF:30s}
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=5000
management.health.mail.enabled=${SAGA_MAIL_ENABLED:false}

# Admin course roster XLSX import. Preview tokens live in Redis with this TTL.
saga.roster.max-file-bytes=${SAGA_ROSTER_MAX_FILE_BYTES:2097152}
saga.roster.preview-ttl=${SAGA_ROSTER_PREVIEW_TTL:15m}
spring.servlet.multipart.max-file-size=${SAGA_ROSTER_MAX_FILE_BYTES:2MB}
spring.servlet.multipart.max-request-size=${SAGA_ROSTER_MAX_FILE_BYTES:2MB}

