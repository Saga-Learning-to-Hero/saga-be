<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SAGA Backend</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #0f1c1a;
        --panel: rgba(255, 252, 247, 0.94);
        --ink: #14221f;
        --muted: #5d6b67;
        --line: rgba(20, 34, 31, 0.08);
        --accent: #1a6b5c;
        --accent-hover: #15574b;
        --ok: #1f8a5b;
        --bad: #b42318;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        font-family: "Segoe UI", system-ui, sans-serif;
        color: var(--ink);
        min-height: 100vh;
        background:
          radial-gradient(900px 480px at 12% -10%, rgba(56, 158, 132, 0.28), transparent 55%),
          radial-gradient(700px 420px at 110% 10%, rgba(196, 122, 58, 0.18), transparent 50%),
          linear-gradient(165deg, #10231f 0%, #0c1614 100%);
        display: grid;
        place-items: center;
        padding: 24px;
      }
      .card {
        width: min(440px, 100%);
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 28px;
        padding: 40px 32px 32px;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.28);
        text-align: center;
      }
      .mark {
        width: 52px;
        height: 52px;
        margin: 0 auto 18px;
        border-radius: 16px;
        background: var(--accent);
        color: #fff;
        display: grid;
        place-items: center;
        font-weight: 800;
        letter-spacing: -0.06em;
        font-size: 1.05rem;
      }
      h1 {
        margin: 0 0 6px;
        font-size: 1.85rem;
        letter-spacing: -0.045em;
      }
      .lede {
        margin: 0 0 28px;
        color: var(--muted);
        font-size: 0.98rem;
        line-height: 1.45;
      }
      .actions {
        display: grid;
        gap: 10px;
      }
      a.button,
      button.button {
        appearance: none;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        width: 100%;
        min-height: 48px;
        border-radius: 14px;
        padding: 12px 16px;
        font: inherit;
        font-weight: 650;
        text-decoration: none;
        border: 1px solid transparent;
        transition: transform 0.12s ease, background 0.12s ease;
      }
      a.button:hover,
      button.button:hover {
        transform: translateY(-1px);
      }
      a.primary {
        background: var(--accent);
        color: #fff;
      }
      a.primary:hover {
        background: var(--accent-hover);
      }
      button.secondary {
        background: #fff;
        color: var(--ink);
        border-color: var(--line);
      }
      .health {
        margin-top: 18px;
        min-height: 22px;
        font-size: 0.92rem;
        font-weight: 650;
        color: var(--muted);
      }
      .health.ok {
        color: var(--ok);
      }
      .health.bad {
        color: var(--bad);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="mark" aria-hidden="true">S</div>
      <h1>SAGA</h1>
      <p class="lede">Student Activity Graph Based Continuous Assessment Project-Based Learning.</p>
      <div class="actions">
        <a class="button primary" href="/swagger-ui.html">Open Swagger UI</a>
        <button class="button secondary" type="button" id="health-btn">Check health</button>
      </div>
      <p class="health" id="health-status" aria-live="polite"></p>
    </main>
    <script>
      const statusEl = document.getElementById("health-status");
      const btn = document.getElementById("health-btn");
      btn.addEventListener("click", async () => {
        statusEl.className = "health";
        statusEl.textContent = "Checking…";
        try {
          const res = await fetch("/actuator/health");
          const body = await res.json();
          const up = body.status === "UP";
          statusEl.className = "health " + (up ? "ok" : "bad");
          statusEl.textContent = up ? "Health: UP" : "Health: " + (body.status || "DOWN");
        } catch (err) {
          statusEl.className = "health bad";
          statusEl.textContent = "Health: unreachable";
        }
      });
    </script>
  </body>
</html>
