spring.datasource.url=${MYSQL_URL}
spring.datasource.username=${MYSQL_USERNAME}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Schema is not designed yet. Enable after ERD + Flyway V1 exist.
spring.flyway.enabled=false

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=10000

management.endpoint.health.show-details=always

# Neo4j / RabbitMQ / Redis are on the classpath but not configured in this phase.
# Disable their health indicators so they do not mark the app DOWN.
# Do not point these services at localhost placeholders.
management.health.neo4j.enabled=false
management.health.rabbit.enabled=false
management.health.redis.enabled=false
