name: Verify V35 MySQL 8.4

on:
  workflow_dispatch:

jobs:
  verify-v35-mysql84:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: saga_v35_test
          MYSQL_USER: saga
          MYSQL_PASSWORD: saga-v35-disposable-password
          MYSQL_ROOT_PASSWORD: saga-v35-disposable-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -psaga-v35-disposable-root-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify MySQL 8.4 service version
        run: |
          version="$(docker exec '${{ job.services.mysql.id }}' mysql -N -uroot -psaga-v35-disposable-root-password -e 'SELECT VERSION();')"
          echo "MySQL version: $version"
          [[ "$version" =~ ^8\.4\. ]]

      - name: Migrate V1 through V34 and seed a pre-V35 run
        env:
          FLYWAY_URL: jdbc:mysql://127.0.0.1:3306/saga_v35_test
          FLYWAY_USER: saga
          FLYWAY_PASSWORD: saga-v35-disposable-password
          MYSQL_CONTAINER: ${{ job.services.mysql.id }}
        run: |
          chmod +x ./mvnw
          ./mvnw -q org.flywaydb:flyway-maven-plugin:12.4.0:migrate \
            -Dflyway.url="$FLYWAY_URL" -Dflyway.user="$FLYWAY_USER" -Dflyway.password="$FLYWAY_PASSWORD" \
            -Dflyway.locations=filesystem:src/main/resources/db/migration -Dflyway.target=34
          docker exec "$MYSQL_CONTAINER" mysql -uroot -psaga-v35-disposable-root-password saga_v35_test -e "
            SET FOREIGN_KEY_CHECKS=0;
            INSERT INTO ai_analysis_run
              (id, artifact_type, artifact_id, artifact_revision, analysis_type, status, evidence_hash,
               policy_version, prompt_version, schema_version, provider_config_hash, idempotency_key)
            VALUES
              ('11111111-1111-1111-1111-111111111111', 'COMMIT', '11111111-1111-1111-1111-111111111111',
               'revision', 'COMMIT_INTELLIGENCE', 'FAILED', REPEAT('a', 64), 'policy', 'prompt', 'schema',
               REPEAT('b', 64), REPEAT('c', 64));"

      - name: Migrate V35, validate Flyway, and prove V35 constraints
        env:
          FLYWAY_URL: jdbc:mysql://127.0.0.1:3306/saga_v35_test
          FLYWAY_USER: saga
          FLYWAY_PASSWORD: saga-v35-disposable-password
          MYSQL_CONTAINER: ${{ job.services.mysql.id }}
        run: |
          set -euo pipefail
          ./mvnw -q org.flywaydb:flyway-maven-plugin:12.4.0:migrate \
            -Dflyway.url="$FLYWAY_URL" -Dflyway.user="$FLYWAY_USER" -Dflyway.password="$FLYWAY_PASSWORD" \
            -Dflyway.locations=filesystem:src/main/resources/db/migration
          ./mvnw -q org.flywaydb:flyway-maven-plugin:12.4.0:validate \
            -Dflyway.url="$FLYWAY_URL" -Dflyway.user="$FLYWAY_USER" -Dflyway.password="$FLYWAY_PASSWORD" \
            -Dflyway.locations=filesystem:src/main/resources/db/migration
          mysql() { docker exec "$MYSQL_CONTAINER" mysql -N -uroot -psaga-v35-disposable-root-password saga_v35_test -e "$1"; }
          test "$(mysql "SELECT MAX(CAST(version AS UNSIGNED)) FROM flyway_schema_history WHERE success = 1 AND version IS NOT NULL;")" = "35"
          test "$(mysql "SELECT COUNT(*) FROM flyway_schema_history WHERE success = 1 AND version IS NOT NULL;")" = "35"
          test "$(mysql "SELECT GROUP_CONCAT(CONCAT(column_name, ':', column_type, ':', is_nullable) ORDER BY column_name SEPARATOR ' ') FROM information_schema.columns WHERE table_schema = 'saga_v35_test' AND table_name = 'ai_analysis_run' AND column_name IN ('canonical_identity_key', 'retry_attempt');")" = "canonical_identity_key:char(64):NO retry_attempt:int unsigned:NO"
          test "$(mysql "SELECT canonical_identity_key = idempotency_key AND retry_attempt = 0 FROM ai_analysis_run WHERE id = '11111111-1111-1111-1111-111111111111';")" = "1"
          mysql "INSERT INTO ai_analysis_run
            (id, artifact_type, artifact_id, artifact_revision, analysis_type, status, evidence_hash, policy_version,
             prompt_version, schema_version, provider_config_hash, idempotency_key, canonical_identity_key, retry_attempt)
            VALUES
            ('22222222-2222-2222-2222-222222222222', 'COMMIT', '11111111-1111-1111-1111-111111111111', 'revision',
             'COMMIT_INTELLIGENCE', 'QUEUED', REPEAT('d',64), 'policy', 'prompt', 'schema', REPEAT('e',64),
             REPEAT('f',64), REPEAT('c',64), 1);"
          if mysql "INSERT INTO ai_analysis_run
            (id, artifact_type, artifact_id, artifact_revision, analysis_type, status, evidence_hash, policy_version,
             prompt_version, schema_version, provider_config_hash, idempotency_key, canonical_identity_key, retry_attempt)
            VALUES
            ('33333333-3333-3333-3333-333333333333', 'COMMIT', '11111111-1111-1111-1111-111111111111', 'revision',
             'COMMIT_INTELLIGENCE', 'QUEUED', REPEAT('d',64), 'policy', 'prompt', 'schema', REPEAT('e',64),
             REPEAT('1',64), REPEAT('c',64), 1);"; then
            echo 'duplicate canonical identity/retry attempt was accepted'; exit 1
          fi
          if mysql "INSERT INTO ai_analysis_run
            (id, artifact_type, artifact_id, artifact_revision, analysis_type, status, evidence_hash, policy_version,
             prompt_version, schema_version, provider_config_hash, idempotency_key, canonical_identity_key, retry_attempt)
            VALUES
            ('44444444-4444-4444-4444-444444444444', 'COMMIT', '11111111-1111-1111-1111-111111111111', 'revision',
             'COMMIT_INTELLIGENCE', 'QUEUED', REPEAT('d',64), 'policy', 'prompt', 'schema', REPEAT('e',64),
             REPEAT('f',64), REPEAT('9',64), 0);"; then
            echo 'duplicate physical idempotency key was accepted'; exit 1
          fi

      - name: Validate Hibernate mappings against V35
        env:
          SAGA_VERIFY_MYSQL_USERNAME: saga
          SAGA_VERIFY_MYSQL_PASSWORD: saga-v35-disposable-password
        run: |
          ./mvnw test \
            -Dtest=com.saga.be.repository.V35MysqlHibernateValidateIT \
            -Dsaga.verify.mysql=true \
            -Dsaga.verify.mysql.url=jdbc:mysql://127.0.0.1:3306/saga_v35_test
